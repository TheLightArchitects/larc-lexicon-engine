[package]
name = "larc-lexicon-engine"
version = "0.1.0"
edition = "2021"
description = "A schema and pure-Rust metrics engine for building queryable writing-voice lexicons from real authored text."
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheLightArchitects/larc-lexicon-engine"
keywords = ["stylometry", "linguistics", "nlp", "authorship", "readability"]
categories = ["text-processing"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
fastembed = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = []
# A reference LexiconEngine backend: SQLite for storage, fastembed (pure
# Rust, ONNX, offline after first model download) for embeddings. Opt-in --
# the core crate has zero dependency on either by default.
sqlite-backend = ["dep:rusqlite", "dep:fastembed", "dep:tokio"]
# The `larc` binary. On its own this builds only the subcommands that need
# nothing but the core crate (`larc profile`); combine with `sqlite-backend`
# to unlock ingest/search/patterns, which require storage and embeddings.
cli = ["dep:clap", "dep:tokio", "tokio/rt-multi-thread"]

[[bin]]
name = "larc"
path = "src/bin/larc.rs"
required-features = ["cli"]
