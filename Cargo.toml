[package]
name = "larc-lexicon-engine"
version = "0.1.0"
edition = "2021"
description = "A schema and pure-Rust metrics engine for building queryable writing-voice lexicons from real authored text."
license = "MIT OR Apache-2.0"
repository = "https://github.com/TheLightArchitects/larc-lexicon-engine"
keywords = ["stylometry", "linguistics", "nlp", "authorship", "readability"]
categories = ["text-processing"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
